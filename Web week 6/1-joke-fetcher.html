<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Fetcher</title>
  <style>
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #f4f1fb; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.card { background: #fff; width: 100%; max-width: 480px; padding: 28px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
h1 { margin-top: 0; }
button { background: #6c4ff0; color: #fff; border: 0; padding: 12px 22px; border-radius: 10px; font-size: 1rem; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary { background: #f0ecff; color: #6c4ff0; margin-top: 12px; }
.status { min-height: 24px; margin-top: 14px; color: #666; }
.status.error { color: #d93025; }
.setup { font-size: 1.15rem; font-weight: 600; }
.punchline { font-size: 1.05rem; color: #6c4ff0; }
.hidden { display: none; }
.spinner { width: 32px; height: 32px; border: 4px solid #e0d9ff; border-top-color: #6c4ff0; border-radius: 50%; margin: 12px auto; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
ul { text-align: left; padding-left: 18px; }
li { margin-bottom: 8px; }
</style>
  <link rel="stylesheet" href="../skip-link.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main class="card" id="main-content" tabindex="-1">
    <h1>Random Joke Fetcher</h1>
    <button id="loadBtn">Load a Joke</button>
    <div id="status" class="status"></div>
    <div id="spinner" class="spinner hidden"></div>
    <p id="setup" class="setup"></p>
    <p id="punchline" class="punchline"></p>
    <button id="favBtn" class="secondary hidden">&#9733; Save Favourite</button>
    <h2>Favourites</h2>
    <ul id="favList"></ul>
  </main>
  <script>
const API_URL = 'https://official-joke-api.appspot.com/random_joke';

const loadBtn = document.getElementById('loadBtn');
const favBtn = document.getElementById('favBtn');
const statusEl = document.getElementById('status');
const spinner = document.getElementById('spinner');
const setupEl = document.getElementById('setup');
const punchlineEl = document.getElementById('punchline');
const favList = document.getElementById('favList');

let currentJoke = null;

async function loadJoke() {
  statusEl.textContent = 'Loading...';
  statusEl.className = 'status';
  spinner.classList.remove('hidden');
  loadBtn.disabled = true;

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('HTTP error: ' + res.status);
    const data = await res.json();

    currentJoke = data;
    setupEl.textContent = data.setup;
    punchlineEl.textContent = data.punchline;
    favBtn.classList.remove('hidden');
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Oops! Could not load a joke. Please try again. (' + err.message + ')';
    statusEl.className = 'status error';
  } finally {
    spinner.classList.add('hidden');
    loadBtn.disabled = false;
  }
}

// ---------- Extra: favourites with localStorage ----------
function getFavs() {
  try { return JSON.parse(localStorage.getItem('favJokes')) || []; }
  catch { return []; }
}

function renderFavs() {
  favList.innerHTML = '';
  getFavs().forEach(j => {
    const li = document.createElement('li');
    li.textContent = j.setup + ' — ' + j.punchline;
    favList.appendChild(li);
  });
}

function saveFav() {
  if (!currentJoke) return;
  const favs = getFavs();
  if (favs.some(j => j.id === currentJoke.id)) return;
  favs.push({ id: currentJoke.id, setup: currentJoke.setup, punchline: currentJoke.punchline });
  localStorage.setItem('favJokes', JSON.stringify(favs));
  renderFavs();
}

loadBtn.addEventListener('click', loadJoke);
favBtn.addEventListener('click', saveFav);
renderFavs();
</script>
</body>
</html>
