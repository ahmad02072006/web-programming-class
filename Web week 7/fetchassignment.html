<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Joke Fetcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f0f4ff;
      color: #1a2340;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      line-height: 1.6;
    }

    main { width: 100%; max-width: 560px; }

    h1 { font-size: 1.8rem; margin-bottom: 4px; }
    .subtitle { color: #5a6a8a; margin-bottom: 24px; font-size: 0.95rem; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #loadBtn { background: #1a56db; color: #fff; }
    #saveBtn { background: #f7df1e; color: #3a3000; }

    /* status + spinner */
    #status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      margin: 20px 0 8px;
      color: #5a6a8a;
    }
    #status.error { color: #dc2626; font-weight: 600; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #c8d4f0;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* joke card */
    #jokeCard {
      background: #fff;
      border: 1px solid #c8d4f0;
      border-radius: 14px;
      padding: 20px 22px;
      display: none;
    }
    #setup { font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; }
    #punchline { color: #1a56db; font-size: 1.05rem; }

    /* favourites */
    h2 { font-size: 1.2rem; margin: 32px 0 10px; }
    #favList { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    #favList li {
      background: #fff;
      border: 1px solid #c8d4f0;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .fav-setup { font-weight: 600; }
    .fav-punch { color: #1a56db; }
    .remove-btn {
      background: #fee2e2;
      color: #7f1d1d;
      padding: 4px 10px;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    #emptyMsg { color: #5a6a8a; font-size: 0.95rem; }

    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      .subtitle, #status, #emptyMsg { color: #94a3b8; }
      #jokeCard, #favList li { background: #1e293b; border-color: #2a3f6a; }
      #punchline, .fav-punch { color: #7aa7ff; }
      .spinner { border-color: #2a3f6a; border-top-color: #7aa7ff; }
      #status.error { color: #fca5a5; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Random Joke Fetcher</h1>
    <p class="subtitle">Week 6 — Fetch API &amp; async/await</p>

    <div class="btn-row">
      <button id="loadBtn">Load Joke</button>
      <button id="saveBtn" disabled>⭐ Save Favourite</button>
    </div>

    <div id="status" aria-live="polite"></div>

    <div id="jokeCard">
      <p id="setup"></p>
      <p id="punchline"></p>
    </div>

    <h2>Favourite jokes</h2>
    <p id="emptyMsg">No favourites yet. Load a joke and click Save Favourite.</p>
    <ul id="favList"></ul>
  </main>

  <script>
    const API_URL = 'https://official-joke-api.appspot.com/random_joke';
    const STORAGE_KEY = 'favouriteJokes';

    const loadBtn   = document.getElementById('loadBtn');
    const saveBtn   = document.getElementById('saveBtn');
    const statusEl  = document.getElementById('status');
    const jokeCard  = document.getElementById('jokeCard');
    const setupEl   = document.getElementById('setup');
    const punchEl   = document.getElementById('punchline');
    const favList   = document.getElementById('favList');
    const emptyMsg  = document.getElementById('emptyMsg');

    let currentJoke = null;

    /* ---------- status helpers ---------- */
    function showLoading() {
      statusEl.className = '';
      statusEl.innerHTML = '<div class="spinner"></div><span>Loading…</span>';
    }

    function showError(message) {
      statusEl.className = 'error';
      statusEl.textContent = message;
    }

    function clearStatus() {
      statusEl.className = '';
      statusEl.textContent = '';
    }

    /* ---------- fetch a joke ---------- */
    async function loadJoke() {
      loadBtn.disabled = true;
      saveBtn.disabled = true;
      showLoading();

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        currentJoke = { setup: data.setup, punchline: data.punchline };
        setupEl.textContent = data.setup;
        punchEl.textContent = data.punchline;
        jokeCard.style.display = 'block';

        clearStatus();
        saveBtn.disabled = false;
      } catch (err) {
        console.error(err);
        showError("Oops! We couldn't fetch a joke right now. Please check your connection and try again.");
      } finally {
        loadBtn.disabled = false;
      }
    }

    /* ---------- favourites (localStorage) ---------- */
    function getFavourites() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function setFavourites(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        showError('Could not save your favourite (storage unavailable).');
      }
    }

    function saveFavourite() {
      if (!currentJoke) return;
      const favs = getFavourites();
      const exists = favs.some(
        j => j.setup === currentJoke.setup && j.punchline === currentJoke.punchline
      );
      if (!exists) {
        favs.push(currentJoke);
        setFavourites(favs);
        renderFavourites();
      }
      saveBtn.textContent = exists ? '⭐ Already saved' : '✅ Saved!';
      setTimeout(() => { saveBtn.textContent = '⭐ Save Favourite'; }, 1500);
    }

    function removeFavourite(index) {
      const favs = getFavourites();
      favs.splice(index, 1);
      setFavourites(favs);
      renderFavourites();
    }

    function renderFavourites() {
      const favs = getFavourites();
      favList.innerHTML = '';
      emptyMsg.style.display = favs.length ? 'none' : 'block';

      favs.forEach((joke, i) => {
        const li = document.createElement('li');

        const text = document.createElement('div');
        const s = document.createElement('div');
        s.className = 'fav-setup';
        s.textContent = joke.setup;
        const p = document.createElement('div');
        p.className = 'fav-punch';
        p.textContent = joke.punchline;
        text.append(s, p);

        const del = document.createElement('button');
        del.className = 'remove-btn';
        del.textContent = 'Remove';
        del.addEventListener('click', () => removeFavourite(i));

        li.append(text, del);
        favList.appendChild(li);
      });
    }

    /* ---------- wire up ---------- */
    loadBtn.addEventListener('click', loadJoke);
    saveBtn.addEventListener('click', saveFavourite);
    renderFavourites();
  </script>
</body>
</html>
