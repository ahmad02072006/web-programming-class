<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Button Counter | Week 4</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="../week2/index.html">Week 2</a>
    <a href="../week3/index.html">Week 3</a>
    <a href="index.html" aria-current="page">Week 4</a>
    <a href="../week5/index.html">Week 5</a>
    <a href="../week7/index.html">Week 7</a>
  </nav>
  <main class="page-shell">
    <p class="instruction">Instructions: Set a button label, press Enter or Update label, then click the demo button to count its events.</p>
    <a class="back-link" href="index.html">← Back to Week 4</a>
    <h1>Event button counter</h1>
    <section class="panel">
      <form id="label-form" novalidate>
        <div class="form-row">
          <label for="button-label">Demo button label</label>
          <input id="button-label" type="text" placeholder="e.g., Click to count">
        </div>
        <div class="button-row">
          <button class="button" type="submit">Update label</button>
          <button class="button button-secondary" type="reset">Reset</button>
        </div>
        <p class="message error" id="error" role="alert"></p>
      </form>
      <button class="demo-button" id="demo-button" type="button">Click me</button>
      <p>Clicks: <output id="click-count" aria-live="polite">0</output></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#label-form');
    const input = document.querySelector('#button-label');
    const error = document.querySelector('#error');
    const demoButton = document.querySelector('#demo-button');
    const countDisplay = document.querySelector('#click-count');
    let count = 0;

    function resetDemo() {
      count = 0;
      countDisplay.textContent = '0';
      demoButton.textContent = 'Click me';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const label = input.value.trim();
      if (!label) {
        error.textContent = 'Please enter a button label.';
        return;
      }
      error.textContent = '';
      demoButton.textContent = label;
    });

    demoButton.addEventListener('click', () => {
      count += 1;
      countDisplay.textContent = String(count);
    });

    form.addEventListener('reset', () => {
      error.textContent = '';
      resetDemo();
    });
  </script>
</body>
</html>
