<p>
  We recommend reading
  <cite>HTML and CSS: Design and Build Websites</cite>
  by Jon Duckett.
</p>

<p>
  The film <cite>Parasite</cite> (2019) by Bong Joon-ho
  is an example of rich visual storytelling.
</p>

<blockquote>
  <p>The web must be universal.</p>
  <!-- cite inside blockquote: the work's title or source -->

</blockquote>
