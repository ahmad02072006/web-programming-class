<!-- ✗ Div soup — machines see meaningless boxes -->
<div class="header">
  <div class="logo">My Site</div>
  <div class="nav">
    <div class="nav-item"><a href="/">Home</a></div>
  </div>
</div>
<div class="main">
  <div class="article">...</div>
</div>
<div class="footer">© 2026</div>

<!-- ✓ Semantic HTML — machines understand the structure -->
<header>
  <h1>My Site</h1>
  <nav>
    <a href="/">Home</a>
  </nav>
</header>
<main id="main-content" tabindex="-1">
  <article>...</article>
</main>
<footer>© 2026</footer>

</body>
