<!-- Topic 11: <figcaption> — Caption for Figure -->

<figure>
  <!-- alt: invisible description for screen readers -->
  <!-- figcaption: visible caption for everyone -->
  <img src="flexbox-demo.gif"
       alt="Animation showing flex items rearranging when flex-direction changes"
       width="500" height="300" loading="lazy">
  <figcaption>Figure 3: Flex direction controls the main axis orientation.</figcaption>
</figure>

<!-- figcaption can go FIRST or LAST inside figure -->
<figure>
  <figcaption>Table 1: Browser support for HTML5 semantic elements.</figcaption>
  <table>
    <tr><th>Element</th><th>Chrome</th><th>Firefox</th><th>Safari</th></tr>
    <tr><td>&lt;main&gt;</td><td>26+</td><td>21+</td><td>7+</td></tr>
    <tr><td>&lt;article&gt;</td><td>6+</td><td>4+</td><td>5+</td></tr>
  </table>
</figure>
