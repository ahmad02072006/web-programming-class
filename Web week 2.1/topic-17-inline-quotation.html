<!-- K0126002 · Web Programming :: Gachon University :: Author: Ochilov Akhmad -->
<!-- Topic 17: <q> — Inline Quotation -->

<p>
  Tim Berners-Lee once said,
  <q cite="https://www.w3.org/People/Berners-Lee/FAQ.html">
    The web is for everyone.
  </q>
</p>

<!-- Browser auto-adds " " around q content -->
<!-- In Korean browsers, it adds 「 」 or " " depending on locale -->

<p>
  As the professor explained,
  <q>semantic HTML is not optional — it is the foundation of the web.</q>
</p>

<!-- Wrong: adding your own quotes inside q -->
<!-- <q>"The web is for everyone."</q> ← removes browser's quotes -->

</body>
