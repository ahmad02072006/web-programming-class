<article>
  <h2>Anatomy of an HTML Page</h2>
  <p>Every HTML file follows the structure shown in Figure 1.
     Notice how the body wraps all visible content.</p>

  <!-- figure groups image + caption as a semantic unit -->
  <figure>
    <img src="html-structure.png"
         alt="Diagram showing DOCTYPE, html, head, and body nesting"
         width="600" height="400" loading="lazy">
    <figcaption>Figure 1: The four required parts of an HTML document.</figcaption>
  </figure>

  <!-- figure can also wrap code samples -->
  <figure>
    <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;...&lt;/html&gt;</code></pre>
    <figcaption>Listing 1: The minimal HTML5 document skeleton.</figcaption>
  </figure>
</article>
