<!-- Topic 09: <div> — The Non-Semantic Container -->

<!-- ✗ Div soup — everything is a div with class names -->
<div class="page-wrapper">
  <div class="header">
    <div class="nav">...</div>
  </div>
  <div class="content">
    <div class="article">...</div>
    <div class="sidebar">...</div>
  </div>
  <div class="footer">...</div>
</div>

<!-- ✓ Semantic HTML — meaningful elements where they fit -->
<div class="page-wrapper">    <!-- div OK: pure CSS layout wrapper -->
  <header>
    <nav>...</nav>
  </header>
  <div class="content-grid"> <!-- div OK: CSS grid container -->
    <main id="main-content" tabindex="-1">
      <article>...</article>
    </main>
    <aside>...</aside>
  </div>
  <footer>...</footer>
</div>

</body>
