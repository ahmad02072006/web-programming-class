<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card | Week 2</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="index.html" aria-current="page">Week 2</a>
    <a href="../week3/index.html">Week 3</a>
    <a href="../week4/index.html">Week 4</a>
    <a href="../week5/index.html">Week 5</a>
    <a href="../week7/index.html">Week 7</a>
  </nav>
  <main class="page-shell">
    <p class="instruction">Instructions: Enter a name and a favorite HTML element to create your profile card.</p>
    <a class="back-link" href="index.html">← Back to Week 2</a>
    <h1>Build a profile card</h1>
    <section class="panel">
      <form id="profile-form" novalidate>
        <div class="form-row">
          <label for="profile-name">Your name</label>
          <input id="profile-name" name="name" type="text" placeholder="e.g., Ada Lovelace">
        </div>
        <div class="form-row">
          <label for="favorite-element">Favorite HTML element</label>
          <input id="favorite-element" name="element" type="text" placeholder="e.g., &lt;main&gt;">
        </div>
        <div class="button-row">
          <button class="button" type="submit">Create card</button>
          <button class="button button-secondary" id="reset" type="reset">Reset</button>
        </div>
        <p class="message error" id="error" role="alert"></p>
      </form>
      <article class="preview-card" id="preview" hidden>
        <h2 id="preview-name"></h2>
        <p>Favorite HTML element: <code id="preview-element"></code></p>
      </article>
    </section>
  </main>
  <script>
    const form = document.querySelector('#profile-form');
    const nameInput = document.querySelector('#profile-name');
    const elementInput = document.querySelector('#favorite-element');
    const error = document.querySelector('#error');
    const preview = document.querySelector('#preview');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const element = elementInput.value.trim();
      if (!name || !element) {
        error.textContent = 'Please enter both your name and a favorite HTML element.';
        return;
      }
      error.textContent = '';
      document.querySelector('#preview-name').textContent = name;
      document.querySelector('#preview-element').textContent = element;
      preview.hidden = false;
    });

    form.addEventListener('reset', () => {
      error.textContent = '';
      preview.hidden = true;
    });
  </script>
</body>
</html>
