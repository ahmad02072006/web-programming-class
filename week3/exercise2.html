<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Grid | Week 3</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="../week2/index.html">Week 2</a>
    <a href="index.html" aria-current="page">Week 3</a>
    <a href="../week4/index.html">Week 4</a>
    <a href="../week5/index.html">Week 5</a>
    <a href="../week7/index.html">Week 7</a>
  </nav>
  <main class="page-shell">
    <p class="instruction">Instructions: Choose 1–8 cards, then switch the preview between a multi-column and single-column layout.</p>
    <a class="back-link" href="index.html">← Back to Week 3</a>
    <h1>Build a responsive grid</h1>
    <section class="panel">
      <form id="grid-form" novalidate>
        <div class="form-row">
          <label for="card-count">Number of cards (1–8)</label>
          <input id="card-count" type="number" min="1" max="8" step="1" placeholder="e.g., 6">
        </div>
        <div class="button-row">
          <button class="button" type="submit">Update cards</button>
          <button class="button button-secondary" id="layout-toggle" type="button">Use one column</button>
          <button class="button button-secondary" type="reset">Reset</button>
        </div>
        <p class="message error" id="error" role="alert"></p>
      </form>
      <div class="layout-preview" id="layout-preview" aria-label="Card layout preview"></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#grid-form');
    const countInput = document.querySelector('#card-count');
    const error = document.querySelector('#error');
    const preview = document.querySelector('#layout-preview');
    const toggle = document.querySelector('#layout-toggle');
    let singleColumn = false;

    function renderCards(count) {
      preview.replaceChildren();
      for (let index = 1; index <= count; index += 1) {
        const card = document.createElement('div');
        card.textContent = `Card ${index}`;
        preview.append(card);
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const count = Number(countInput.value);
      if (!countInput.value.trim() || !Number.isInteger(count) || count < 1 || count > 8) {
        error.textContent = 'Enter a whole number from 1 to 8.';
        return;
      }
      error.textContent = '';
      renderCards(count);
    });

    toggle.addEventListener('click', () => {
      singleColumn = !singleColumn;
      preview.classList.toggle('single-column', singleColumn);
      toggle.textContent = singleColumn ? 'Use grid layout' : 'Use one column';
    });

    form.addEventListener('reset', () => {
      error.textContent = '';
      singleColumn = false;
      preview.classList.remove('single-column');
      toggle.textContent = 'Use one column';
      renderCards(3);
    });

    renderCards(3);
  </script>
</body>
</html>
