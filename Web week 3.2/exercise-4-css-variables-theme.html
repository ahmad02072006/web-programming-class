<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 4: CSS Variables Theme</title>
<style>
  :root {
    --primary: #0f766e;
    --accent:  #14b8a6;
    --bg:      #f0fdfa;
    --text:    #1e293b;
    --radius:  10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:   #051a0a;
      --text: #d4edda;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: 20px;
  }

  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent); }

  .card {
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
    color: var(--text);
  }
</style>
  <link rel="stylesheet" href="../skip-link.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>

  </main>
</body>
</html>
