<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 3: Loading Spinner with @keyframes</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    background: #f0fdfa;
    margin: 0;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .spinner {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 4px solid #ccfbf1;   /* light teal ring */
    border-top-color: #0f766e;  /* dark teal arc */
    animation: spin 0.8s linear infinite;
  }
</style>
  <link rel="stylesheet" href="../skip-link.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
  <div class="spinner"></div>

  </main>
</body>
</html>
